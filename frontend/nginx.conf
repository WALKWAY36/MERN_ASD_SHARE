server {
    listen 80;
    server_name localhost;
    
    # Корневая директория
    root /usr/share/nginx/html;
    index index.html;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Основной location для React приложения с basename /autmama
    location /autmama {
        alias /usr/share/nginx/html/autmama;
        try_files $uri $uri/ /autmama/index.html;
        
        # Заголовки для безопасности
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }

    # Редирект с корня на /autmama
    location = / {
        return 301 /autmama/;
    }

    # Проксирование API запросов на BFF
    location /api {
        proxy_pass http://bff:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Увеличиваем таймауты для загрузки файлов
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}